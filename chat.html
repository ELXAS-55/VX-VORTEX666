body{background:var(--bg);color:var(--parchment);font-family:"Rajdhani",sans-serif;height:100vh;overflow:hidden;position:relative;}

a{color:inherit;text-decoration:none;}

.stars-layer{position:absolute;inset:-50%;width:200%;height:200%;

    radial-gradient(1.5px 1.5px at 20% 30%, #ffffff 100%, transparent),
    radial-gradient(1.5px 1.5px at 75% 15%, #ffffff 100%, transparent),
    radial-gradient(1px 1px at 50% 60%, #bcd9ff 100%, transparent),
    radial-gradient(1.5px 1.5px at 85% 75%, #ffffff 100%, transparent),

#panelEmoji,#panelSticker{position:absolute;bottom:60px;left:0;right:0;height:210px;background:var(--panel2);border-top:1px solid rgba(47,143,255,.25);z-index:30;display:none;}

::-webkit-scrollbar-thumb{background:rgba(47,143,255,.3);border-radius:4px;}

/* -------- comprimir imagen a base64 (igual que el resto de la web) -------- */
function comprimir(file, maxKB, maxSize){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        let w=img.width,h=img.height;
        if(w>maxSize){h=h*(maxSize/w);w=maxSize;}
        if(h>maxSize){w=w*(maxSize/h);h=maxSize;}
        c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.85,result=c.toDataURL("image/jpeg",q);
        while(result.length>maxKB*1024*1.37 && q>0.3){q-=0.1;result=c.toDataURL("image/jpeg",q);}
        res(result);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* -------- identidad guardada en este dispositivo -------- */
function uidGen(){return 'u'+Date.now()+Math.random().toString(36).slice(2,8);}
let miUid = localStorage.getItem('vxChatUid');
if(!miUid){ miUid = uidGen(); localStorage.setItem('vxChatUid', miUid); }
let miNombre = localStorage.getItem('vxChatNombre') || '';
let miFoto = localStorage.getItem('vxChatFoto') || '';
let fotoTemp = null;

document.getElementById('uploadBox').onclick = ()=> document.getElementById('fotoInput').click();
document.getElementById('fotoInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  fotoTemp = await comprimir(file, 80, 300);
  document.getElementById('uploadBox').innerHTML = `<img src="${fotoTemp}">`;
};

if(miNombre){
  document.getElementById('nombreInput').value = miNombre;
  if(miFoto) document.getElementById('uploadBox').innerHTML = `<img src="${miFoto}">`;
}

document.getElementById('btnEntrar').onclick = async ()=>{
  const nombre = document.getElementById('nombreInput').value.trim();
  const el = document.getElementById('msgEntrada');
  if(!nombre){ el.textContent='Escribe tu nombre.'; el.style.display='block'; return; }
  miNombre = nombre;
  if(fotoTemp) miFoto = fotoTemp;
  localStorage.setItem('vxChatNombre', miNombre);
  if(miFoto) localStorage.setItem('vxChatFoto', miFoto);
  await db.collection('chatUsuarios').doc(miUid).set({
    nombre: miNombre, foto: miFoto || null, ultimaVez: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});
  document.getElementById('entrada').style.display='none';
  iniciarChat();
};

/* -------- presencia (activo/desconectado) -------- */
function iniciarPresencia(){
  const marcar = ()=> db.collection('chatUsuarios').doc(miUid).set({
    ultimaVez: firebase.firestore.FieldValue.serverTimestamp(), offline:false
  }, {merge:true});
  marcar();
  setInterval(marcar, 20000);
  window.addEventListener('beforeunload', ()=>{
    db.collection('chatUsuarios').doc(miUid).set({offline:true},{merge:true});
  });
}

/* -------- marcar como leído (para los check azules) -------- */
function marcarLectura(){
  if(document.visibilityState === 'visible'){
    db.collection('chatUsuarios').doc(miUid).set({
      ultimaLectura: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }
}
function iniciarLectura(){
  marcarLectura();
  setInterval(marcarLectura, 5000);
  document.addEventListener('visibilitychange', marcarLectura);
  window.addEventListener('focus', marcarLectura);
}

/* -------- miembros + activos -------- */
let miembrosCache = {};
function iniciarMiembros(){
  db.collection('chatUsuarios').onSnapshot(snap=>{
    miembrosCache = {};
    snap.forEach(d=> miembrosCache[d.id] = d.data());
    document.getElementById('numTotal').textContent = snap.size + ' miembros';
    pintarMiembros();
    pintarChecks();
  });
  setInterval(pintarMiembros, 10000);
}
function pintarMiembros(){
  const cont = document.getElementById('listaMiembros');
  cont.innerHTML = '';
  let activos = 0;
  const ahora = Date.now();
  Object.entries(miembrosCache).forEach(([uid, m])=>{
    const vezMs = m.ultimaVez && m.ultimaVez.toMillis ? m.ultimaVez.toMillis() : 0;
    const enLinea = !m.offline && (ahora - vezMs < 35000);
    if(enLinea) activos++;
    const row = document.createElement('div');
    row.className = 'memberRow';
    const inicial = (m.nombre||'?').charAt(0).toUpperCase();
    row.innerHTML = `
      <div class="memberAvatar">${m.foto?`<img src="${m.foto}">`:inicial}<div class="statusDot ${enLinea?'on':''}"></div></div>
      <div><div class="memberName">${escapeHtml(m.nombre||'Miembro')}</div><div class="memberStatus">${enLinea?'En línea':'Desconectado'}</div></div>`;
    cont.appendChild(row);
  });
  document.getElementById('numActivos').textContent = activos + ' activos';
}
document.getElementById('abrirMiembros').onclick = ()=>{
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
};
document.getElementById('overlay').onclick = ()=>{
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
};

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

/* -------- emojis estilo iPhone (se ven igual en Android) -------- */
const EMOJIS = ['😀','😂','🤣','😍','😎','🥳','😭','😡','🤔','😏','👍','👎','🙏','💪','🔥','⚡','💀','👑','🎮','🏆','🚀','💯','❤️','🧠','😱','🥶','🤝','👀','🎯','🕹️','😅','🙌'];
function emojiImg(e, size){
  return `<img class="emoji-img" style="${size?`width:${size}px;height:${size}px;`:''}" src="https://emojicdn.elk.sh/${encodeURIComponent(e)}?style=apple" onerror="this.replaceWith(document.createTextNode('${e}'))">`;
}
const gridEmoji = document.getElementById('gridEmoji');
EMOJIS.forEach(e=>{
  const span = document.createElement('span');
  span.innerHTML = emojiImg(e, 26);
  span.onclick = ()=>{ document.getElementById('texto').value += e; };
  gridEmoji.appendChild(span);
});
function renderTexto(texto){
  const escapado = escapeHtml(texto);
  return escapado.replace(/\p{Extended_Pictographic}/gu, m => emojiImg(m, 19));
}

document.getElementById('btnEmoji').onclick = ()=>{
  document.getElementById('panelSticker').classList.remove('show');
  document.getElementById('panelEmoji').classList.toggle('show');
};
document.getElementById('btnSticker').onclick = ()=>{
  document.getElementById('panelEmoji').classList.remove('show');
  document.getElementById('panelSticker').classList.toggle('show');
};

/* -------- "escribiendo..." -------- */
let typingTimeout;
document.getElementById('texto').addEventListener('input', ()=>{
  db.collection('chatEscribiendo').doc(miUid).set({nombre:miNombre, ts:firebase.firestore.FieldValue.serverTimestamp()});
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=> db.collection('chatEscribiendo').doc(miUid).delete().catch(()=>{}), 3000);
});
function iniciarEscribiendo(){
  db.collection('chatEscribiendo').onSnapshot(snap=>{
    const ahora = Date.now();
    const otros = [];
    snap.forEach(d=>{
      if(d.id === miUid) return;
      const t = d.data();
      const ms = t.ts && t.ts.toMillis ? t.ts.toMillis() : 0;
      if(ahora - ms < 4000) otros.push(t.nombre || 'Alguien');
    });
    const normal = document.getElementById('estadoNormal');
    const escribiendo = document.getElementById('estadoEscribiendo');
    if(otros.length){
      normal.style.display = 'none';
      escribiendo.style.display = 'block';
      escribiendo.textContent = otros.length === 1
        ? `${otros[0]} está escribiendo...`
        : `${otros.length} personas están escribiendo...`;
    } else {
      normal.style.display = 'flex';
      escribiendo.style.display = 'none';
    }
  });
}

/* -------- notificaciones (mientras el chat está abierto de fondo / instalado) -------- */
let primeraCargaMensajes = true;
function pedirNotificaciones(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}
function mostrarNotificacion(m){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const cuerpo = m.tipo === 'sticker' ? '📷 Envió un sticker' : (m.texto || '');
  const opciones = {body: cuerpo, icon: 'icon-192.png', tag: 'vx-chat'};
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=> reg.showNotification(m.nombre || 'Nuevo mensaje', opciones)).catch(()=>{
      try{ new Notification(m.nombre || 'Nuevo mensaje', opciones); }catch(e){}
    });
  } else {
    try{ new Notification(m.nombre || 'Nuevo mensaje', opciones); }catch(e){}
  }
}

/* -------- checks de leído en mis propios mensajes -------- */
let ultimosMensajes = [];
function pintarChecks(){
  ultimosMensajes.forEach(m=>{
    const el = document.getElementById('check-'+m.id);
    if(!el) return;
    const leido = Object.entries(miembrosCache).some(([uid, mem])=>{
      if(uid === miUid) return false;
      const lecMs = mem.ultimaLectura && mem.ultimaLectura.toMillis ? mem.ultimaLectura.toMillis() : 0;
      const msjMs = m.fecha && m.fecha.toMillis ? m.fecha.toMillis() : 0;
      return lecMs > msjMs;
    });
    el.textContent = '✓✓';
    el.classList.toggle('leido', leido);
    if(!leido) el.textContent = '✓';
  });
}

/* -------- mensajes -------- */
function iniciarMensajes(){
  db.collection('chatMensajes').orderBy('fecha','asc').limit(200).onSnapshot(snap=>{
    const box = document.getElementById('mensajes');
    box.innerHTML = '';
    ultimosMensajes = [];
    snap.forEach(doc=>{
      const m = doc.data();
      ultimosMensajes.push({id:doc.id, ...m});
      const esMio = m.uid === miUid;
      const fila = document.createElement('div');
      fila.className = 'fila' + (esMio?' yo':'');
      const foto = (miembrosCache[m.uid] && miembrosCache[m.uid].foto) || m.foto || '';
      const inicial = (m.nombre||'?').charAt(0).toUpperCase();
      const hora = m.fecha && m.fecha.toDate ? m.fecha.toDate().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) : '';
      const checks = esMio ? `<span class="checks" id="check-${doc.id}">✓</span>` : '';
      let burbuja = '';
      if(m.tipo === 'sticker'){
        burbuja = `<div class="burbuja sticker"><img src="${m.stickerURL}"><div class="pie"><span class="hora">${hora}</span>${checks}</div></div>`;
      } else {
        burbuja = `<div class="burbuja">${renderTexto(m.texto||'')}<div class="pie"><span class="hora">${hora}</span>${checks}</div></div>`;
      }
      fila.innerHTML = `
        <div class="mAvatar">${foto?`<img src="${foto}">`:inicial}</div>
        <div class="mCol"><div class="mSender">${escapeHtml(m.nombre||'')}</div>${burbuja}</div>`;
      box.appendChild(fila);
    });
    box.scrollTop = box.scrollHeight;
    pintarChecks();
    marcarLectura();

    if(!primeraCargaMensajes){
      snap.docChanges().forEach(change=>{
        if(change.type === 'added'){
          const m = change.doc.data();
          if(m.uid !== miUid && document.visibilityState !== 'visible'){
            mostrarNotificacion(m);
          }
        }
      });
    }
    primeraCargaMensajes = false;
  });
}

document.getElementById('enviar').onclick = enviarMensaje;
document.getElementById('texto').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarMensaje(); }
});
async function enviarMensaje(){
  const input = document.getElementById('texto');
  const texto = input.value.trim();
  if(!texto) return;
  input.value = '';
  db.collection('chatEscribiendo').doc(miUid).delete().catch(()=>{});
  await db.collection('chatMensajes').add({
    uid: miUid, nombre: miNombre, foto: miFoto || null,
    tipo: 'texto', texto, fecha: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* -------- stickers -------- */
document.getElementById('addStickerLabel').onclick = ()=> document.getElementById('stickerInput').click();
document.getElementById('stickerInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const url = await comprimir(file, 60, 260);
  await db.collection('chatStickers').add({url, creadoPor: miNombre, fecha: firebase.firestore.FieldValue.serverTimestamp()});
};
function iniciarStickers(){
  db.collection('chatStickers').orderBy('fecha','asc').onSnapshot(snap=>{
    const grid = document.getElementById('gridSticker');
    grid.querySelectorAll('.stickerItem').forEach(el=>el.remove());
    snap.forEach(doc=>{
      const s = doc.data();
      const item = document.createElement('div');
      item.className = 'stickerItem';
      item.innerHTML = `<img src="${s.url}">`;
      item.onclick = async ()=>{
        await db.collection('chatMensajes').add({
          uid: miUid, nombre: miNombre, foto: miFoto || null,
          tipo: 'sticker', stickerURL: s.url, fecha: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('panelSticker').classList.remove('show');
      };
      grid.insertBefore(item, document.getElementById('addStickerLabel'));
    });
  });
}

function iniciarChat(){
  pedirNotificaciones();
  iniciarPresencia();
  iniciarLectura();
  iniciarMiembros();
  iniciarMensajes();
  iniciarStickers();
  iniciarEscribiendo();
}

/* si ya entró antes en este dispositivo, saltar la pantalla de entrada */
if(miNombre){
  document.getElementById('entrada').style.display='none';
  iniciarChat();
}
</script>
